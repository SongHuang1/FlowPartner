appId: com.flowpartner.app
productName: FlowPartner
directories:
  output: dist-electron
files:
  - dist/**
  - electron/**
extraResources:
  - from: bin/
    to: bin/
    filter:
      - flowpartner-backend*
      - flowpartner-agent*
  - from: dist/
    to: dist/
    filter:
      - '**/*'

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: FlowPartner-Windows-${version}-${arch}.${ext}
mac:
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.productivity
  artifactName: FlowPartner-macOS-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
  artifactName: FlowPartner-Linux-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FlowPartner

appId: com.flowpartner.app
productName: FlowPartner
directories:
  output: dist-electron
files:
  - dist/**
  - electron/**
extraResources:
  - from: bin/
    to: bin/
    filter:
      - flowpartner-backend*
      - flowpartner-agent*
  - from: dist/
    to: dist/
    filter:
      - '**/*'
# 注意：目标不在此处指定 arch —— 架构由 release 流程的 CLI 参数（--x64 / --arm64）
# 决定。若在配置里列出 arch（含 universal），会覆盖 CLI 参数导致每个矩阵任务
# 构建所有架构，且 universal 合并会因 extraResources 中的单架构二进制失败。
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: FlowPartner-Windows-${version}-${arch}.${ext}
mac:
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.productivity
  artifactName: FlowPartner-macOS-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
  artifactName: FlowPartner-Linux-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FlowPartner

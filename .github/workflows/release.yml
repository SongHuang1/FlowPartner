name: Release


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # NOTE: PyInstaller is not a cross-compiler — the agent binary takes the
      # architecture of the runner it is built on. Therefore each matrix row
      # must run on a runner whose native arch matches the target arch:
      #   - windows x64  -> windows-latest        (x64)
      #   - macos x64    -> macos-15-intel        (Intel)
      #   - macos arm64  -> macos-latest          (Apple Silicon)
      #   - linux x64    -> ubuntu-latest         (x64)
      #   - linux arm64  -> ubuntu-24.04-arm      (arm64)
      # 无 Windows arm64：grpcio 未发布 win_arm64 wheel（源码编译脆弱），
      # Windows 11 ARM 设备可安装 x64 版经系统模拟运行。
      matrix:
        include:
          - platform: windows-latest
            go_os: windows
            go_arch: amd64
            arch: x64
            ext: .exe
          - platform: macos-15-intel
            go_os: darwin
            go_arch: amd64
            arch: x64
            ext: ''
          - platform: macos-latest
            go_os: darwin
            go_arch: arm64
            arch: arm64
            ext: ''
          - platform: ubuntu-latest
            go_os: linux
            go_arch: amd64
            arch: x64
            ext: ''
          - platform: ubuntu-24.04-arm
            go_os: linux
            go_arch: arm64
            arch: arm64
            ext: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Go backend
        working-directory: backend
        shell: bash
        run: |
          mkdir -p ../frontend/bin
          OUTPUT="../frontend/bin/flowpartner-backend${{ matrix.ext }}"
          GOOS=${{ matrix.go_os }} GOARCH=${{ matrix.go_arch }} go build -ldflags="-s -w" -o "$OUTPUT" ./cmd/server/
          echo "Built: $OUTPUT"
          ls -la "$OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        shell: bash
        run: pip install uv

      - name: Build Python Agent
        working-directory: agent
        shell: bash
        run: |
          # 跳过 dev 组：grpcio-tools 无 win_arm64 预编译 wheel，仅 protoc 需要
          uv sync --frozen --no-default-groups --group build
          uv run --no-sync pyinstaller flowpartner-agent.spec
          cp dist/flowpartner-agent${{ matrix.ext }} ../frontend/bin/flowpartner-agent${{ matrix.ext }}
          echo "Built: ../frontend/bin/flowpartner-agent${{ matrix.ext }}"
          ls -la ../frontend/bin/flowpartner-agent${{ matrix.ext }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Electron app
        working-directory: frontend
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ "${{ matrix.go_os }}" = "windows" ]; then
            npx electron-builder --win --${{ matrix.arch }} --publish never
          elif [ "${{ matrix.go_os }}" = "darwin" ]; then
            npx electron-builder --mac --${{ matrix.arch }} --publish never
          else
            npx electron-builder --linux --${{ matrix.arch }} --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.go_os }}-${{ matrix.go_arch }}
          path: |
            frontend/dist-electron/*.dmg
            frontend/dist-electron/*.exe
            frontend/dist-electron/*.deb
            frontend/dist-electron/*.rpm
            frontend/dist-electron/*.AppImage
            frontend/dist-electron/*.blockmap
            frontend/dist-electron/builder-debug.yml
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: FlowPartner ${{ github.ref_name || github.event.inputs.tag }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

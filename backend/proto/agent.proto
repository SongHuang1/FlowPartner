syntax = "proto3";
option go_package = "github.com/songhuang/flowpartner/backend/proto;proto";
package flowpartner;

// --- 1. Python 发给 Go 的事件 (实时汇报) ---
message AgentEvent {
    string session_id = 1;
    string thread_id = 11;
    string turn_id = 12;
    oneof payload {
        turn_started turn_started = 4;
        turn_completed turn_completed = 5;
        turn_aborted turn_aborted = 6;
        item_started item_started = 7;
        item_completed item_completed = 8;
        item_delta item_delta = 9;
        usage_update usage_update = 13;
        permission_request permission_request = 14;
        subagent_event subagent = 15;
        error error = 16;
    }
}

message turn_started {
    string thread_id = 1;
    string turn_id = 2;
}

message turn_completed {
    string thread_id = 1;
    string turn_id = 2;
    string last_agent_message = 3;
    int64 duration_ms = 4;
}

message turn_aborted {
    string thread_id = 1;
    string turn_id = 2;
    string reason = 3;
}

message item_started {
    string item_id = 1;
    string item_type = 2;
    string thread_id = 3;
    string turn_id = 4;
}

message item_completed {
    string item_id = 1;
    string item_type = 2;
    string thread_id = 3;
    string turn_id = 4;
    string payload = 5;
}

message item_delta {
    string item_id = 1;
    string item_type = 2;
    string delta = 3;
    int32 seq = 4;
    string thread_id = 5;
    string turn_id = 6;
}

message usage_update {
    int32 input_tokens = 1;
    int32 cached_input_tokens = 2;
    int32 output_tokens = 3;
    int32 reasoning_output_tokens = 4;
    int32 total_tokens = 5;
    int32 model_context_window = 6;
    bool estimated = 7;
}

message permission_request {
    string request_id = 1;
    string tool = 2;
    string path = 3;
    string operation = 4;
    string detail = 5;
    repeated string scope_options = 6;
}

message subagent_event {
    string event_type = 1; // "subagent_start", "subagent_step", "subagent_end", "subagent_error"
    string payload = 2;    // JSON
}

message error {
    string message = 1;
    string guess = 2;
}

// --- 2. Go 发给 Python 的指令 (下发任务) ---
message ServerCommand {
    string session_id = 1;
    string command_type = 2; // "start_chat", "cancel_task", "steer_input", "abort_turn", "permission_response", "agents_changed"
    string payload = 3;      // JSON 格式
}

// --- 3. Agent 请求 Go 代为调用大模型（服务端流式，方便 Go 控制 API Key 和计费） ---
message LLMRequest {
    string session_id = 1;
    string json_payload = 2; // Python 组装好的完整请求体
}

message LLMResponse {
    bool is_error = 1;         // 是否为错误终止信号。true 表示此次推送为错误终止
    string json_response = 2;  // 正常 chunk: 单个 SSE chunk 原始 JSON；错误时: 错误详情 JSON
    string message_id = 3;     // 消息唯一标识，用于前端追踪
    UsagePayload usage = 4;
}

message UsagePayload {
    int32 prompt_tokens = 1;
    int32 cached_tokens = 2;
    int32 completion_tokens = 3;
    int32 reasoning_tokens = 4;
    int32 total_tokens = 5;
}

// --- 4. 工具执行代理 ---
message ToolRequest {
    string session_id = 1;
    string tool_name = 2;    // 工具名称：read, write, bash, edit, trash, purge
    string arguments = 3;    // JSON 格式的工具参数
    string approval_id = 4;  // 越权审批通过后携带的审批 ID（一次性）
}

message ToolResponse {
    bool success = 1;        // 是否执行成功
    string result = 2;       // 成功时的结果文本 / 失败时的中文错误文案
    string error_code = 3;   // 失败时的稳定错误码（如 TOOL_NOT_FOUND, PATH_OUTSIDE_WORKSPACE）
    bool needs_permission = 4; // true = 需用户审批（路径越权，或 purge 这类按策略强制审批的操作）
    string request_id = 5;   // 越权申请的唯一 ID（needs_permission=true 时返回）
}

// --- 5. 智能体定义（多 Agent） ---
message Empty {}

message AgentDef {
    string id = 1;             // UUID v4；内置主智能体固定为 "main"
    string name = 2;
    string description = 3;    // 对外描述，暴露给其他 agent 判断是否调用
    string system_prompt = 4;  // 私有，仅 Python（可信后端）与编辑界面可见
    int64 created_at = 5;
    int64 updated_at = 6;
}

message AgentId {
    string id = 1;
}

message AgentDefList {
    repeated AgentDef agents = 1;
}

// --- 6. 核心服务定义 ---
service FlowPartnerService {
    // 核心双向流：Python 和 Go 建立持久连接，互相实时推送消息
    rpc SyncChannel (stream AgentEvent) returns (stream ServerCommand);

    // 代理调用大模型（服务端流式）：Python 发送请求，Go 逐 chunk 返回流式响应
    rpc CallLLM (LLMRequest) returns (stream LLMResponse);

    // 代理执行工具（一元调用）：Python 发送工具请求，Go 执行并返回结果
    rpc ExecuteTool (ToolRequest) returns (ToolResponse);

    // 拉取全部智能体定义（含 system_prompt，Python 为可信后端）
    rpc ListAgents (Empty) returns (AgentDefList);

    // 按 ID 获取单个智能体定义
    rpc GetAgent (AgentId) returns (AgentDef);
}

syntax = "proto3";
option go_package = "github.com/songhuang/flowpartner/backend/proto;proto";
package flowpartner;

// --- 消息定义 ---
message RegisterRequest {
    string agent_version = 1;
    string workspace_path = 2;
}

message RegisterResponse {
    bool success = 1;
    string message = 2;
}

message TaskCommand {
    string task_id = 1;
    string task_type = 2; 
    string payload = 3;    
}

message TaskResult {
    string task_id = 1;
    bool success = 2;
    string message = 3;
    string result_data = 4;
}

message SubmitResponse {
    bool received = 1;
}

// --- 新增：Agent 请求 Go 调用大模型 ---
message LLMRequest {
    string session_id = 1;
    string json_payload = 2; // Python 组装好的完整请求体 (包含 messages, tools 等)
}

message LLMResponse {
    bool success = 1;
    string error_message = 2;
    string json_response = 3; // 大模型返回的原始响应体
}

// --- 服务定义 ---
service FlowPartnerService {
    // 1. Go 主动下发任务 (Server Streaming)
    rpc ReceiveTasks (RegisterRequest) returns (stream TaskCommand);
    
    // 2. Agent 提交最终任务结果 (Unary)
    rpc SubmitResult (TaskResult) returns (SubmitResponse);

    // 3. Agent 请求 Go 代为调用大模型 API (Unary)
    rpc CallLLM (LLMRequest) returns (LLMResponse);
}
[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
# 仅运行时依赖。grpcio-tools 无 win_arm64 预编译 wheel（源码编译在 MSVC ARM64 上失败），
# 且只用于 protoc 代码生成，因此放在 dev 组；pyinstaller 仅构建期需要，放在 build 组。
dependencies = [
    "grpcio>=1.83.0",
    # 生成的 agent_pb2.py 直接 import google.protobuf，必须显式声明（勿依赖 grpcio-tools 传递）
    "protobuf>=7.35.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-grpcio>=1.60.0",
    "types-protobuf>=5.28.0",
]
build = [
    "pyinstaller>=6.21.0",
]

[tool.uv]
# 不在此处配置 index-url：镜像属个人网络环境偏好，写入仓库会导致任何不带 --frozen 的
# uv 命令把 uv.lock 的源改写为镜像，破坏 GitHub CI。本机提速请用用户级
# %APPDATA%\uv\uv.toml 或 UV_INDEX_URL（且日常命令仍须 --frozen / --no-sync）。
# 本地 `uv sync` 默认安装 dev + build 组；CI 打包用
# `uv sync --frozen --no-default-groups --group build` 跳过 dev 组
default-groups = ["dev", "build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
exclude = ["src/agent/agent_pb2_grpc.py", "src/agent/agent_pb2.py"]

[tool.mypy]
python_version = "3.12"
# src 作为包基：tests 的 `from agent.* import` 与包内 `from agent.* import` 统一解析，避免双路径冲突
mypy_path = "src"
files = ["src", "tests"]
# protoc 生成文件：动态构建的 protobuf 类无法静态分析，排除出检查范围（导入处视为 Any）
exclude = ["src/agent/agent_pb2.py", "src/agent/agent_pb2_grpc.py"]

# protoc 生成文件：跳过其内部检查（导入处视为 Any）
[[tool.mypy.overrides]]
module = ["agent.agent_pb2", "agent.agent_pb2_grpc"]
follow_imports = "skip"
